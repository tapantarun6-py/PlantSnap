<!DOCTYPE html>
<html>
<head>
    <title>PlantSnap - AI Leaf Identifier</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
            background: #f4f4f4;
        }
        .box {
            padding: 20px;
            border: 1px solid #ddd;
            width: 40%;
            margin: auto;
            background: white;
            border-radius: 10px;
        }
        img {
            width: 250px;
            margin-top: 20px;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>🌿 PlantSnap - AI Leaf Identifier</h1>

    <div class="box">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br><br>
            <button type="submit">Identify Plant</button>
        </form>

        {% if prediction %}
            <h2>Prediction: {{ prediction }}</h2>
            <img src="{{ file_path }}">
        {% endif %}
    </div>
</body>
</html>
